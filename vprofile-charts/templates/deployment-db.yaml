apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.db.name }}
  labels:
    app: {{ .Values.db.name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.db.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.db.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.db.name }}
    spec:
      {{- if .Values.dockerRegistry.enabled }}
      imagePullSecrets:
        - name: {{ .Values.dockerRegistry.name }}
      {{- end }}
      containers:
        - name: {{ .Values.db.name }}
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          ports:
            - name: vprodb-port
              containerPort: {{ .Values.db.containerPort }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: db-pass
          volumeMounts:
            - name: vpro-db-data
              mountPath: {{ .Values.db.mountPath }}
      initContainers:
        - name: busybox
          image: "{{ .Values.initContainers.busybox.image.repository }}:{{ .Values.initContainers.busybox.image.tag }}"
          command:
            - sh
            - -c
            - rm -rf {{ .Values.db.mountPath }}/lost+found
          volumeMounts:
            - name: vpro-db-data
              mountPath: {{ .Values.db.mountPath }}
      volumes:
        - name: vpro-db-data
          persistentVolumeClaim:
            claimName: {{ .Values.db.pvc.name }}
